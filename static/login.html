<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · AI课代表</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/login.css"><script src="/login.js" defer></script></head><body><main class="login-page"><form id="login-form" class="card"><a class="logo" href="/">◈ AI课代表</a><h1>进入你的工作空间</h1><p class="muted">登录后只显示你自己的任务。飞书任务需在个人资料中绑定身份。</p><label>账号<input name="username" required minlength="3" maxlength="40" pattern="[A-Za-z0-9_.-]+" autocomplete="username" placeholder="字母、数字、下划线，至少3位"></label><label>密码<input name="password" required type="password" minlength="10" maxlength="200" autocomplete="current-password" placeholder="至少10位"></label><p id="login-error" role="alert"></p><div class="actions"><button id="login-submit">登录</button><button type="button" class="ghost" id="register-account">创建新账号</button></div><small class="muted">使用本网站的独立密码，不是飞书登录密码。注册新账号不会获得他人的历史任务。</small></form></main></body></html>
